<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 334" width="880" height="334" role="img" aria-label="RTX 5060 Empirical Roofline Oscilloscope and Live Terminal Telemetry">
  <defs>
    <linearGradient id="leftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="memShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cmpShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roofStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="72%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="scopeSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="92%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.28"/>
    </linearGradient>
    <clipPath id="leftClip"><rect x="1" y="1" width="504" height="332" rx="12"/></clipPath>
    <clipPath id="rightClip"><rect x="520" y="1" width="359" height="332" rx="12"/></clipPath>
    <clipPath id="plotClip"><rect x="62.0" y="64.0" width="414.0" height="208.0"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    @keyframes roofPulse { 0% { stroke-dashoffset: 320; } 100% { stroke-dashoffset: -220; } }
    @keyframes heroRipple { 0% { r: 5; stroke-opacity: 0.95; } 100% { r: 16; stroke-opacity: 0; } }
    @keyframes scopeMove { 0% { transform: translateX(0px); } 100% { transform: translateX(414px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .roofTracer { stroke-dasharray: 46 494; animation: roofPulse 4.0s linear infinite; }
    .ripple { animation: heroRipple 2.2s ease-out infinite; }
    .sweep { animation: scopeMove 6.5s linear infinite; }
    .cursor { animation: blink 1.05s step-end infinite; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

  <!-- ==================== LEFT BENTO CARD: ROOFLINE OSCILLOSCOPE ==================== -->
  <g clip-path="url(#leftClip)">
    <rect x="0" y="0" width="506" height="334" fill="url(#leftBg)"/>
    <!-- Precision Instrument Header -->
    <rect x="16" y="16" width="6.5" height="6.5" rx="1.5" fill="#0369a1"/>
    <text x="29" y="22.8" fill="#0f172a" font-size="10.2" font-weight="700" letter-spacing="0.55" class="mono">EMPIRICAL GPU ROOFLINE <tspan fill="#64748b" font-weight="500">· SM_120</tspan></text>
    <rect x="364" y="10.5" width="128" height="19" rx="9.5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.9"/>
    <text x="428" y="23.2" text-anchor="middle" fill="#047857" font-size="8.4" font-weight="700" class="mono">● 5-RUN ABA MEDIAN</text>

    <!-- Embedded Obsidian OLED Oscilloscope Well (crisp Light Silicon Blueprint well) -->
    <rect x="12" y="38" width="482" height="284" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Plot Frame Inside OLED -->
    <rect x="62.0" y="64.0" width="414.0" height="208.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Shaded Regimes + Animated Sweep -->
    <g clip-path="url(#plotClip)">
      <polygon points="62.0,272.0 62.0,244.5 410.9,90.3 410.9,272.0" fill="url(#memShade)"/>
      <polygon points="410.9,272.0 410.9,90.3 476.0,90.3 476.0,272.0" fill="url(#cmpShade)"/>
      <g class="sweep"><rect x="34.0" y="64.0" width="28" height="208.0" fill="url(#scopeSweep)"/><line x1="62.0" y1="64.0" x2="62.0" y2="272.0" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.45"/></g>
    </g>

    <!-- Log-Log Grid & Axis Ticks -->
    <line x1="74.2" y1="64.0" x2="74.2" y2="272.0" stroke="#e2e8f0" stroke-width="0.8"/><text x="74.2" y="286.0" text-anchor="middle" fill="#64748b" font-size="8.6" class="mono">0.1</text><line x1="199.6" y1="64.0" x2="199.6" y2="272.0" stroke="#e2e8f0" stroke-width="0.8"/><text x="199.6" y="286.0" text-anchor="middle" fill="#64748b" font-size="8.6" class="mono">1</text><line x1="325.0" y1="64.0" x2="325.0" y2="272.0" stroke="#e2e8f0" stroke-width="0.8"/><text x="325.0" y="286.0" text-anchor="middle" fill="#64748b" font-size="8.6" class="mono">10</text><line x1="450.4" y1="64.0" x2="450.4" y2="272.0" stroke="#e2e8f0" stroke-width="0.8"/><text x="450.4" y="286.0" text-anchor="middle" fill="#64748b" font-size="8.6" class="mono">100</text><line x1="410.9" y1="90.3" x2="410.9" y2="272.0" stroke="#6d28d9" stroke-width="1.1" stroke-dasharray="3 3" stroke-opacity="0.78"/><text x="410.9" y="286.0" text-anchor="middle" fill="#6d28d9" font-size="8.6" font-weight="700" class="mono">48.4</text><line x1="62.0" y1="266.6" x2="476.0" y2="266.6" stroke="#e2e8f0" stroke-width="0.8"/><text x="55.0" y="269.6" text-anchor="end" fill="#64748b" font-size="8.6" class="mono">0.01</text><line x1="62.0" y1="211.2" x2="476.0" y2="211.2" stroke="#e2e8f0" stroke-width="0.8"/><text x="55.0" y="214.2" text-anchor="end" fill="#64748b" font-size="8.6" class="mono">0.1</text><line x1="62.0" y1="155.7" x2="476.0" y2="155.7" stroke="#e2e8f0" stroke-width="0.8"/><text x="55.0" y="158.7" text-anchor="end" fill="#64748b" font-size="8.6" class="mono">1</text><line x1="62.0" y1="100.2" x2="476.0" y2="100.2" stroke="#e2e8f0" stroke-width="0.8"/><text x="55.0" y="103.2" text-anchor="end" fill="#64748b" font-size="8.6" class="mono">10</text><line x1="62.0" y1="73.8" x2="476.0" y2="73.8" stroke="#e2e8f0" stroke-width="0.8"/><text x="55.0" y="76.8" text-anchor="end" fill="#64748b" font-size="8.6" class="mono">30</text>

    <!-- Regime Watermarks -->
    <text x="310" y="264" text-anchor="middle" fill="#64748b" font-size="8.2" font-weight="700" letter-spacing="1.2" opacity="0.65" class="mono">MEMORY-BOUND</text>
    <text x="441" y="264" text-anchor="middle" fill="#6d28d9" font-size="8.0" font-weight="700" letter-spacing="0.8" opacity="0.72" class="mono">COMPUTE</text>

    <!-- Roofline Ceilings -->
    <g clip-path="url(#plotClip)">
      <line x1="62.0" y1="239.6" x2="433.2" y2="75.4" stroke="#64748b" stroke-width="1.15" stroke-dasharray="4 4" stroke-opacity="0.65"/>
      <polyline points="62.0,244.5 410.9,90.3 476.0,90.3" fill="none" stroke="url(#roofStroke)" stroke-width="2.4" stroke-linejoin="round"/>
      <polyline points="62.0,244.5 410.9,90.3 476.0,90.3" fill="none" stroke="#047857" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="roofTracer"/>
    </g>

    <!-- Clean Non-Overlapping Roofline Annotations -->
    <g transform="translate(256.0,158.8) rotate(-23.86)">
      <line x1="-64" y1="-25" x2="-50" y2="-25" stroke="#64748b" stroke-width="1.1" stroke-dasharray="3 2.5"/>
      <text x="-46" y="-22.2" fill="#475569" font-size="7.8" class="mono">Nominal GDDR7 384 GB/s</text>
      <line x1="-78" y1="-12.5" x2="-64" y2="-12.5" stroke="#047857" stroke-width="1.9" stroke-linecap="round"/>
      <text x="-60" y="-9.7" fill="#047857" font-size="8.1" font-weight="700" class="mono">Measured D2D 312.6 GB/s (81.4%)</text>
    </g>
    <!-- Compute Plateau Label Above OLED Top Margin (Clean Zero Collision!) -->
    <text x="476" y="56" text-anchor="end" fill="#6d28d9" font-size="8.5" font-weight="700" class="mono">Sustained E2E: 15.13 TFLOPS (SAC S=4096)</text>
    <text x="62" y="56" text-anchor="start" fill="#64748b" font-size="8.1" class="mono">Log₁₀ Perf vs Operational Intensity</text>

    <!-- Ridge Vertex -->
    <circle cx="410.9" cy="90.3" r="3.4" fill="#f8fafc" stroke="#6d28d9" stroke-width="1.6"/>

    <!-- POINT 1: Amber — M=1 Decode Launch-Bound -->
    <line x1="111.9" y1="245.5" x2="133.9" y2="247.5" stroke="#b45309" stroke-width="1.1"/>
    <circle cx="111.9" cy="245.5" r="4.3" fill="#b45309" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="137.9" y="246.5" fill="#b45309" font-size="8.6" font-weight="700" class="mono">M=1 Decode RoPE/Norm</text>
    <text x="137.9" y="257.5" fill="#475569" font-size="8.0" class="mono">11.6 / 13.8 μs (launch)</text>

    <!-- POINT 2: HERO Emerald — FusedAddRMSNorm (.cu) ON Bandwidth Roof -->
    <polyline points="183.9,190.8 144,190.8 144,124" fill="none" stroke="#047857" stroke-width="1.2"/>
    <rect x="68" y="88" width="164" height="36" rx="5.5" fill="#ecfdf5" stroke="#047857" stroke-width="1.1"/>
    <text x="76" y="102.5" fill="#047857" font-size="8.6" font-weight="700" class="mono">FusedAddRMSNorm (.cu)</text>
    <text x="76" y="116" fill="#0f172a" font-size="8.4" font-weight="700" class="mono">311.0 GB/s · 99.5% D2D</text>
    <circle cx="183.9" cy="190.8" r="8" fill="none" stroke="#047857" stroke-width="1.4" class="ripple"/>
    <circle cx="183.9" cy="190.8" r="5.2" fill="#047857" stroke="#f8fafc" stroke-width="1.6" filter="url(#glow)"/>

    <!-- POINT 3: Cyan — PagedAttn Split-KV -->
    <line x1="298.9" y1="145.1" x2="314" y2="176" stroke="#0284c7" stroke-width="1.1"/>
    <circle cx="298.9" cy="145.1" r="4.6" fill="#0284c7" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="266" y="176" width="136" height="33" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.95"/>
    <text x="274" y="190" fill="#0284c7" font-size="8.5" font-weight="700" class="mono">PagedAttn Split-KV</text>
    <text x="274" y="202" fill="#334155" font-size="8.0" class="mono">65.4 μs · 1.76× SDPA</text>

    <!-- POINT 4: Violet — SAC + Triton FA2 ON Compute Ceiling -->
    <line x1="429.4" y1="90.3" x2="429.4" y2="132" stroke="#6d28d9" stroke-width="1.1"/>
    <circle cx="429.4" cy="90.3" r="4.8" fill="#6d28d9" stroke="#f8fafc" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="357" y="132" width="112" height="33" rx="5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="0.95"/>
    <text x="364" y="146" fill="#6d28d9" font-size="8.4" font-weight="700" class="mono">SAC + Triton FA2</text>
    <text x="364" y="158" fill="#334155" font-size="7.9" class="mono">15.13 TF · 32K ctx</text>

    <!-- Axis Titles -->
    <text x="269" y="307" text-anchor="middle" fill="#475569" font-size="8.9" font-weight="600" class="mono">Operational Intensity I (FLOP / Byte) · Log₁₀ Scale</text>
    <text transform="translate(26, 168) rotate(-90)" text-anchor="middle" fill="#475569" font-size="8.9" font-weight="600" class="mono">Attained Perf (TFLOP/s)</text>
  </g>
  <rect x="1" y="1" width="504" height="332" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ==================== RIGHT BENTO CARD: LIVE TERMINAL ==================== -->
  <g clip-path="url(#rightClip)">
    <rect x="519" y="0" width="361" height="334" fill="url(#termBg)"/>
    <!-- Terminal Title Bar -->
    <rect x="519" y="0" width="361" height="34" fill="#eef2f7"/>
    <line x1="519" y1="34" x2="880" y2="34" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="538" cy="17" r="4.3" fill="#ef4444" opacity="0.88"/>
    <circle cx="553" cy="17" r="4.3" fill="#f59e0b" opacity="0.88"/>
    <circle cx="568" cy="17" r="4.3" fill="#10b981" opacity="0.88"/>
    <text x="708" y="20.5" text-anchor="middle" fill="#475569" font-size="9.2" font-weight="600" class="mono">zsh — yuri-infra@blackwell:~</text>

    <!-- Shell Prompt -->
    <text x="537" y="55" font-size="9.5" class="mono">
      <tspan fill="#047857" font-weight="700">❯</tspan>
      <tspan fill="#0f172a" font-weight="600"> neofetch --ai-infra --verify</tspan>
    </text>
    <line x1="537" y1="62" x2="862" y2="62" stroke="#e2e8f0" stroke-width="0.9"/>

    <!-- Aligned Key-Value Telemetry Rows -->
    <text x="537" y="77.0" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">M.Eng.</text><text x="589" y="77.0" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="77.0" fill="#0f172a" font-size="9.2" class="mono">Fudan Univ. · Elec. Info (2026–29)</text><text x="537" y="96.2" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">B.Eng.</text><text x="589" y="96.2" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="96.2" fill="#334155" font-size="9.2" class="mono">Tiangong Univ. · 1/59 (GPA 3.92)</text><text x="537" y="115.4" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">GPU</text><text x="589" y="115.4" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="115.4" fill="#0f172a" font-size="9.2" class="mono">RTX 5060 Laptop (sm_120 · 8GB)</text><text x="537" y="134.6" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Roof</text><text x="589" y="134.6" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="134.6" fill="#047857" font-size="9.2" class="mono">312.6 GB/s D2D · 26 SMs</text><text x="537" y="153.8" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Kernels</text><text x="589" y="153.8" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="153.8" fill="#334155" font-size="9.2" class="mono">CUDA C++ (.cu) · PTX · Triton</text><text x="537" y="173.0" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Compiler</text><text x="589" y="173.0" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="173.0" fill="#334155" font-size="9.2" class="mono">PyTorch 2.13 · Core ATen · Inductor</text><text x="537" y="192.2" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Systems</text><text x="589" y="192.2" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="192.2" fill="#334155" font-size="9.2" class="mono">PagedAttn · RadixTree · RingAttn</text><text x="537" y="211.4" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Profile</text><text x="589" y="211.4" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="211.4" fill="#334155" font-size="9.2" class="mono">cuobjdump · Roofline · profiler</text><text x="537" y="230.6" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Paper</text><text x="589" y="230.6" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="230.6" fill="#0f172a" font-size="9.2" class="mono">IEEE/RSJ IROS '25 (Corr. Auth/Rev)</text><text x="537" y="249.8" fill="#0284c7" font-size="9.3" font-weight="700" class="mono">Intern</text><text x="589" y="249.8" fill="#94a3b8" font-size="9.3" class="mono">:</text><text x="599" y="249.8" fill="#334155" font-size="9.2" class="mono">Uniview · Embedded C (6 mos)</text>

    <line x1="537" y1="266" x2="862" y2="266" stroke="#e2e8f0" stroke-width="0.9"/>

    <!-- Verification Prompt & Terminal Swatches -->
    <text x="537" y="286" font-size="9.0" class="mono">
      <tspan fill="#047857" font-weight="700">❯</tspan>
      <tspan fill="#475569"> python3 tests/test_*.py</tspan>
      <tspan fill="#047857" font-weight="700"> → 24/24 PASS</tspan>
      <tspan fill="#047857" class="cursor"> ▍</tspan>
    </text>
    <rect x="537" y="305" width="16" height="8" rx="2" fill="#cbd5e1"/><rect x="558" y="305" width="16" height="8" rx="2" fill="#047857"/><rect x="579" y="305" width="16" height="8" rx="2" fill="#0284c7"/><rect x="600" y="305" width="16" height="8" rx="2" fill="#0369a1"/><rect x="621" y="305" width="16" height="8" rx="2" fill="#6d28d9"/><rect x="642" y="305" width="16" height="8" rx="2" fill="#b45309"/><rect x="663" y="305" width="16" height="8" rx="2" fill="#e11d48"/><rect x="684" y="305" width="16" height="8" rx="2" fill="#334155"/>
    <text x="862" y="313" text-anchor="end" fill="#64748b" font-size="8.2" font-weight="600" class="mono">CUDA 13.0 · BF16</text>
  </g>
  <rect x="520" y="1" width="359" height="332" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
</svg>