<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="qwen-paged-serving architecture blueprint card">
  <defs>
    <linearGradient id="cBg_02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="dGrid_02" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.65"/>
    </pattern>
    <clipPath id="cClip_02"><rect x="1" y="1" width="878" height="170" rx="12"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    
    @keyframes rx1 { 0% { stroke-dashoffset: 155; } 100% { stroke-dashoffset: -45; } }
    @keyframes rx2 { 0% { stroke-dashoffset: 115; } 100% { stroke-dashoffset: -85; } }
    @keyframes swp { 0% { stroke-dashoffset: 36; } 100% { stroke-dashoffset: 0; } }
    .rx1 { stroke-dasharray: 24 176; animation: rx1 2.5s linear infinite; }
    .rx2 { stroke-dasharray: 22 178; animation: rx2 3.0s linear infinite; }
    .swp { stroke-dasharray: 6 6; animation: swp 1.3s linear infinite; }
    

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

  <g clip-path="url(#cClip_02)">
    <rect x="0" y="0" width="880" height="172" fill="url(#cBg_02)"/>
    <!-- Left Domain Accent Spine -->
    <rect x="0" y="0" width="6" height="172" fill="#0369a1"/>

    <!-- Left 326x146 Crisp Light Silicon Blueprint Micro-Display -->
    <rect x="18" y="13" width="324" height="146" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="19" y="14" width="322" height="144" rx="7" fill="url(#dGrid_02)"/>
    <text x="29" y="28" fill="#0284c7" font-size="8.1" font-weight="700" letter-spacing="0.65" class="mono">RADIX-TREE → PAGED KV</text>
    <text x="332" y="28" text-anchor="end" fill="#64748b" font-size="7.6" font-weight="600" class="mono">16-TOK · 0.63% FRAG</text>
    <g>
      <!-- Radix-Tree Static Base Edges -->
      <path d="M 60 66 H 112 L 146 52 H 192" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-opacity="0.42" stroke-linejoin="round"/>
      <path d="M 60 66 H 112 L 146 82 H 192" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-opacity="0.42" stroke-linejoin="round"/>
      <path d="M 60 66 L 86 120 H 106" fill="none" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 2.5"/>

      <!-- Animated Glowing Prefix Lookup Packets -->
      <path d="M 60 66 H 112 L 146 52 H 192" fill="none" stroke="#0284c7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="rx1"/>
      <path d="M 60 66 H 112 L 146 82 H 192" fill="none" stroke="#047857" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="rx2"/>

      <!-- Tree Nodes -->
      <rect x="28" y="55" width="35" height="22" rx="4.5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.15"/>
      <text x="45.5" y="69" text-anchor="middle" fill="#0284c7" font-size="8.1" font-weight="700" class="mono">SYS</text>

      <rect x="92" y="55" width="40" height="22" rx="4.5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.25"/>
      <text x="112" y="69" text-anchor="middle" fill="#0284c7" font-size="8.0" font-weight="700" class="mono">CoW</text>

      <circle cx="154" cy="52" r="4.3" fill="#0284c7" stroke="#f8fafc" stroke-width="1.3"/>
      <text x="154" y="44" text-anchor="middle" fill="#334155" font-size="7.6" class="mono">qA</text>
      <circle cx="154" cy="82" r="4.3" fill="#047857" stroke="#f8fafc" stroke-width="1.3"/>
      <text x="154" y="96" text-anchor="middle" fill="#334155" font-size="7.6" class="mono">qB</text>

      <rect x="108" y="110" width="54" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
      <text x="135" y="123" text-anchor="middle" fill="#475569" font-size="7.6" class="mono">heapq</text>

      <!-- Non-Contiguous 16-Tok KV Page Pool -->
      <rect x="194" y="42" width="30" height="22" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.25"/><text x="209" y="56.5" text-anchor="middle" fill="#0284c7" font-size="8.2" font-weight="700" class="mono">P0</text><rect x="229" y="42" width="30" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="244" y="56.5" text-anchor="middle" fill="#64748b" font-size="8.2" class="mono">P1</text><rect x="264" y="42" width="30" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="279" y="56.5" text-anchor="middle" fill="#64748b" font-size="8.2" class="mono">P2</text><rect x="299" y="42" width="30" height="22" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.25"/><text x="314" y="56.5" text-anchor="middle" fill="#0284c7" font-size="8.2" font-weight="700" class="mono">P4</text><rect x="194" y="70" width="30" height="22" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.25"/><text x="209" y="84.5" text-anchor="middle" fill="#047857" font-size="8.2" font-weight="700" class="mono">P5</text><rect x="229" y="70" width="30" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/><text x="244" y="84.5" text-anchor="middle" fill="#64748b" font-size="8.2" class="mono">P6</text><rect x="264" y="70" width="30" height="22" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.25"/><text x="279" y="84.5" text-anchor="middle" fill="#0284c7" font-size="8.2" font-weight="700" class="mono">P7</text><rect x="299" y="70" width="30" height="22" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.25"/><text x="314" y="84.5" text-anchor="middle" fill="#047857" font-size="8.2" font-weight="700" class="mono">P9</text>

      <!-- LIFO Async Swap -->
      <path d="M 254 98 V 120" fill="none" stroke="#b45309" stroke-width="1.6" class="swp"/>
      <text x="262" y="112" fill="#b45309" font-size="7.6" font-weight="700" class="mono">LIFO Swap ↕</text>
      <rect x="194" y="122" width="135" height="24" rx="4.5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
      <text x="261.5" y="137.5" text-anchor="middle" fill="#b45309" font-size="8.1" font-weight="700" class="mono">CPU Pinned Pool</text>
    </g>

    <!-- Right Specification Panel -->
    <g>
      <rect x="358" y="17" width="28" height="21" rx="5" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
      <text x="372" y="31.5" text-anchor="middle" fill="#0369a1" font-size="10.2" font-weight="700" class="mono">02</text>
      <text x="395" y="33" fill="#0f172a" font-size="16.5" font-weight="700" class="mono">qwen-paged-serving</text>

      <!-- Verified Tests Pill + Explore Pill -->
      <rect x="698" y="16" width="70" height="22" rx="11" fill="#f8fafc" stroke="#dbe4ef" stroke-width="0.9"/>
      <text x="733" y="30.2" text-anchor="middle" fill="#047857" font-size="8.2" font-weight="700" class="mono">8/8 PASS</text>

      <rect x="774" y="16" width="88" height="22" rx="11" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
      <text x="818" y="30.2" text-anchor="middle" fill="#0369a1" font-size="9.0" font-weight="700" letter-spacing="0.4" class="mono">EXPLORE ↗</text>

      <!-- 1-Line Engineering Thesis -->
      <text x="358" y="56" fill="#334155" font-size="11.0" class="sans">24L Qwen2.5 serving engine: GQA Tensor Core PagedAttn, Radix-Tree &amp; Chunked-Prefill.</text>

      <!-- 3 KPI Chips -->
      <rect x="358" y="70" width="162" height="52" rx="7" fill="#f8fafc" stroke="#dbe4ef" stroke-width="1"/><rect x="358" y="70" width="162" height="2.6" rx="1.3" fill="#0369a1"/><text x="369" y="92" fill="#0369a1" font-size="13.8" font-weight="700" class="mono">7.37× tok/s</text><text x="369" y="108.5" fill="#64748b" font-size="8.7" class="mono">839.9 tok/s · 83.8% hit</text><rect x="369" y="114.5" width="140" height="2.5" rx="1.25" fill="#e2e8f0"/><rect x="369" y="114.5" width="128" height="2.5" rx="1.25" fill="#0369a1" opacity="0.88"/><rect x="528" y="70" width="162" height="52" rx="7" fill="#f8fafc" stroke="#dbe4ef" stroke-width="1"/><rect x="528" y="70" width="162" height="2.6" rx="1.3" fill="#e2e8f0"/><text x="539" y="92" fill="#0f172a" font-size="13.8" font-weight="700" class="mono">-90.5% P99</text><text x="539" y="108.5" fill="#64748b" font-size="8.7" class="mono">289→27.45ms ITL</text><rect x="539" y="114.5" width="140" height="2.5" rx="1.25" fill="#e2e8f0"/><rect x="539" y="114.5" width="126" height="2.5" rx="1.25" fill="#64748b" opacity="0.88"/><rect x="698" y="70" width="162" height="52" rx="7" fill="#f8fafc" stroke="#dbe4ef" stroke-width="1"/><rect x="698" y="70" width="162" height="2.6" rx="1.3" fill="#e2e8f0"/><text x="709" y="92" fill="#0f172a" font-size="13.8" font-weight="700" class="mono">0.63% Frag</text><text x="709" y="108.5" fill="#64748b" font-size="8.7" class="mono">down from 35.99%</text><rect x="709" y="114.5" width="140" height="2.5" rx="1.25" fill="#e2e8f0"/><rect x="709" y="114.5" width="137" height="2.5" rx="1.25" fill="#64748b" opacity="0.88"/>

      <!-- Bottom Tech Stack Strip -->
      <circle cx="362" cy="144" r="3.2" fill="#0369a1"/>
      <text x="372" y="147.5" fill="#64748b" font-size="9.1" font-weight="600" class="mono">Triton PagedAttn · Radix-Tree · Chunked-Prefill · LIFO Swap · asyncio SSE</text>
    </g>
