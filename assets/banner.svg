<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220" role="img" aria-label="Hongwei Zhu yuri-infra AI Infra Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1623"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#39c5cf"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="gridPat" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="848" height="218" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes coreGlow1 { 0%, 100% { fill-opacity: 0.16; } 50% { fill-opacity: 0.65; } }
    @keyframes coreGlow2 { 0%, 100% { fill-opacity: 0.55; } 50% { fill-opacity: 0.14; } }
    .cursor { animation: blink 1.05s step-end infinite; }
    .led { animation: pulseDot 2.2s ease-in-out infinite; }
    .c1 { animation: coreGlow1 2.8s ease-in-out infinite; }
    .c2 { animation: coreGlow2 2.8s ease-in-out infinite; }
    .c3 { animation: coreGlow1 3.4s ease-in-out infinite; }
  </style>

  <!-- Main Card Frame -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="850" height="220" fill="url(#bgGrad)"/>
    <rect x="0" y="34" width="850" height="186" fill="url(#gridPat)"/>

    <!-- Terminal Titlebar -->
    <rect x="0" y="0" width="850" height="34" fill="#161b22"/>
    <line x1="0" y1="34" x2="850" y2="34" stroke="#30363d" stroke-width="1"/>
    <circle cx="22" cy="17" r="5.5" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="5.5" fill="#ffbd2e"/>
    <circle cx="58" cy="17" r="5.5" fill="#27c93f"/>
    <text x="425" y="21" text-anchor="middle" fill="#8b949e" font-size="11.5" class="mono">yuri-infra@fudan-gpu-lab: ~/ai-infra — zsh</text>

    <!-- Status Pill (Top Right) -->
    <rect x="708" y="8" width="124" height="18" rx="9" fill="#0d1117" stroke="#238636" stroke-width="0.9"/>
    <circle cx="721" cy="17" r="3.5" fill="#3fb950" class="led"/>
    <text x="731" y="20.5" fill="#3fb950" font-size="9.5" font-weight="600" class="mono">SM_120 ONLINE</text>

    <!-- Subtle Decorative Silicon Die Artwork on Right -->
    <g transform="translate(690, 50)" opacity="0.92">
      <!-- Trace lines -->
      <path d="M -38 22 H 4 M -22 44 H 4 M -30 66 H 4" stroke="#39c5cf" stroke-width="1" opacity="0.32" fill="none"/>
      <path d="M 108 22 H 140 M 108 44 H 134 M 108 66 H 146" stroke="#a371f7" stroke-width="1" opacity="0.28" fill="none"/>
      <!-- Pins -->
      <g stroke="#475569" stroke-width="2" stroke-linecap="round">
        <line x1="22" y1="0" x2="22" y2="8"/><line x1="42" y1="0" x2="42" y2="8"/><line x1="62" y1="0" x2="62" y2="8"/><line x1="82" y1="0" x2="82" y2="8"/>
        <line x1="22" y1="84" x2="22" y2="92"/><line x1="42" y1="84" x2="42" y2="92"/><line x1="62" y1="84" x2="62" y2="92"/><line x1="82" y1="84" x2="82" y2="92"/>
        <line x1="4" y1="22" x2="12" y2="22"/><line x1="4" y1="46" x2="12" y2="46"/><line x1="4" y1="70" x2="12" y2="70"/>
        <line x1="92" y1="22" x2="100" y2="22"/><line x1="92" y1="46" x2="100" y2="46"/><line x1="92" y1="70" x2="100" y2="70"/>
      </g>
      <!-- Chip Body -->
      <rect x="12" y="8" width="80" height="76" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.4"/>
      <!-- 2x2 Tensor Core Die -->
      <rect x="22" y="18" width="26" height="24" rx="3" fill="#3fb950" stroke="#3fb950" stroke-width="0.9" class="c1"/>
      <rect x="56" y="18" width="26" height="24" rx="3" fill="#39c5cf" stroke="#39c5cf" stroke-width="0.9" class="c2"/>
      <rect x="22" y="50" width="26" height="24" rx="3" fill="#39c5cf" stroke="#39c5cf" stroke-width="0.9" class="c3"/>
      <rect x="56" y="50" width="26" height="24" rx="3" fill="#a371f7" stroke="#a371f7" stroke-width="0.9" class="c1"/>
      <text x="52" y="106" text-anchor="middle" fill="#6e7681" font-size="8.5" class="mono">CUDA · TRITON</text>
    </g>

    <!-- Terminal Prompt Line -->
    <text x="32" y="64" font-size="12" class="mono">
      <tspan fill="#3fb950" font-weight="700">$</tspan>
      <tspan fill="#8b949e"> ./yuri-infra --mode=</tspan><tspan fill="#39c5cf">gpu-systems</tspan><tspan fill="#8b949e"> --target=</tspan><tspan fill="#a371f7">ai-infra</tspan>
    </text>

    <!-- Hero Name + Handle + Inline Blinking Cursor (Font-Metric Safe) -->
    <text x="32" y="104" font-size="29" font-weight="700" class="sans">
      <tspan fill="#f0f6fc">Hongwei Zhu</tspan>
      <tspan fill="#484f58" font-weight="400"> · </tspan>
      <tspan fill="#39c5cf" class="mono" font-size="24">yuri-infra</tspan><tspan fill="#3fb950" class="mono cursor" font-size="22"> ▊</tspan>
    </text>

    <!-- Subtitle -->
    <text x="32" y="129" fill="#c9d1d9" font-size="11.8" class="mono">M.Eng. @ Fudan Univ.  |  CUDA C++ &amp; Triton  ·  TorchInductor  ·  LLM Systems</text>

    <!-- Thin Gradient Rule -->
    <rect x="32" y="143" width="590" height="1.5" rx="1" fill="url(#accentLine)" opacity="0.75"/>

    <!-- 4 Telemetry KPI Pills -->
    <g transform="translate(32, 158)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="186" height="44" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="16" fill="#8b949e" font-size="9.5" class="mono">HBM ROOFLINE (512MB)</text>
      <text x="12" y="34" font-size="13.5" font-weight="700" class="mono"><tspan fill="#3fb950">99.5% D2D</tspan><tspan fill="#6e7681" font-size="10.5" font-weight="400"> 311 GB/s</tspan></text>

      <!-- KPI 2 -->
      <rect x="200" y="0" width="186" height="44" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="212" y="16" fill="#8b949e" font-size="9.5" class="mono">24-WAY SERVING</text>
      <text x="212" y="34" font-size="13.5" font-weight="700" class="mono"><tspan fill="#39c5cf">7.37x</tspan><tspan fill="#6e7681" font-size="10.5" font-weight="400"> 840 tok/s</tspan></text>

      <!-- KPI 3 -->
      <rect x="400" y="0" width="186" height="44" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="412" y="16" fill="#8b949e" font-size="9.5" class="mono">SINGLE-8GB CONTEXT</text>
      <text x="412" y="34" font-size="13.5" font-weight="700" class="mono"><tspan fill="#a371f7">32K (32x)</tspan><tspan fill="#6e7681" font-size="10.5" font-weight="400"> 2-step</tspan></text>

      <!-- KPI 4 -->
      <rect x="600" y="0" width="186" height="44" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="612" y="16" fill="#8b949e" font-size="9.5" class="mono">LAUNCH REDUCTION</text>
      <text x="612" y="34" font-size="13.5" font-weight="700" class="mono"><tspan fill="#58a6ff">-50.9%</tspan><tspan fill="#6e7681" font-size="10.5" font-weight="400"> 814→400</tspan></text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="848" height="218" rx="12" fill="none" stroke="#30363d" stroke-width="1.3"/>
</svg>
