<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 156" width="850" height="156" role="img" aria-label="qwen-32k-longctx-train project architecture card">
  <defs>
    <linearGradient id="cBg_03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafcfe"/>
      <stop offset="100%" stop-color="#f3f7fb"/>
    </linearGradient>
    <pattern id="dGrid_03" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#e8eef5" stroke-width="0.6" stroke-opacity="0.75"/>
    </pattern>
    <clipPath id="cClip_03">
      <rect x="1" y="1" width="848" height="154" rx="10"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes ringCW1 { 0% { stroke-dashoffset: 380; } 100% { stroke-dashoffset: -44; } }
    @keyframes ringCW2 { 0% { stroke-dashoffset: 168; } 100% { stroke-dashoffset: -256; } }
    .rng1 { stroke-dasharray: 34 390; animation: ringCW1 3.6s linear infinite; }
    .rng2 { stroke-dasharray: 34 390; animation: ringCW2 3.6s linear infinite; }
  </style>

  <g clip-path="url(#cClip_03)">
    <rect x="0" y="0" width="850" height="156" fill="url(#cBg_03)"/>
    <!-- 4px Domain Color Spine -->
    <rect x="0" y="0" width="5.5" height="156" fill="#7c3aed"/>

    <!-- Left 300x132 Bespoke Animated Micro-Diagram Well -->
    <rect x="18" y="12" width="300" height="132" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="19" y="13" width="298" height="130" rx="6" fill="url(#dGrid_03)"/>
    <text x="28" y="25" fill="#7c3aed" font-size="7.8" font-weight="700" letter-spacing="0.7" class="mono">ZIGZAG CAUSAL RING P2P · 4-RANK</text>
    <g>
      <!-- Clockwise P2P Ring Base Trace -->
      <path d="M 168 45 C 228 45, 256 61, 256 86 C 256 111, 228 127, 168 127 C 108 127, 80 111, 80 86 C 80 61, 108 45, 168 45 Z" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-opacity="0.34"/>
      <!-- Dual Opposite Animated Glowing P2P (K,V) Packets -->
      <path d="M 168 45 C 228 45, 256 61, 256 86 C 256 111, 228 127, 168 127 C 108 127, 80 111, 80 86 C 80 61, 108 45, 168 45 Z" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)" class="rng1"/>
      <path d="M 168 45 C 228 45, 256 61, 256 86 C 256 111, 228 127, 168 127 C 108 127, 80 111, 80 86 C 80 61, 108 45, 168 45 Z" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" class="rng2"/>

      <!-- Clockwise Direction Chevrons -->
      <polygon points="222,52 230,56 224,60" fill="#7c3aed" opacity="0.85"/>
      <polygon points="224,112 230,116 222,120" fill="#7c3aed" opacity="0.85"/>
      <polygon points="114,120 106,116 112,112" fill="#7c3aed" opacity="0.85"/>
      <polygon points="112,60 106,56 114,52" fill="#7c3aed" opacity="0.85"/>

      <!-- Center Balance Hub -->
      <rect x="130" y="71" width="76" height="30" rx="15" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="168" y="84.5" text-anchor="middle" fill="#7c3aed" font-size="8.6" font-weight="700" class="mono">1.00× BAL</text>
      <text x="168" y="95" text-anchor="middle" fill="#64748b" font-size="7" class="mono">P2P (K,V)</text>

      <!-- 4 Rank Nodes -->
      <rect x="134" y="33" width="68" height="24" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="168" y="44.5" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="700" class="mono">R0 <tspan fill="#334155" font-weight="600">[c0,c7]</tspan></text><text x="168" y="53.5" text-anchor="middle" fill="#64748b" font-size="6.8" class="mono">25% FLOPs</text>
      <rect x="222" y="74" width="68" height="24" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="256" y="85.5" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="700" class="mono">R1 <tspan fill="#334155" font-weight="600">[c1,c6]</tspan></text><text x="256" y="94.5" text-anchor="middle" fill="#64748b" font-size="6.8" class="mono">25% FLOPs</text>
      <rect x="134" y="115" width="68" height="24" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="168" y="126.5" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="700" class="mono">R2 <tspan fill="#334155" font-weight="600">[c2,c5]</tspan></text><text x="168" y="135.5" text-anchor="middle" fill="#64748b" font-size="6.8" class="mono">25% FLOPs</text>
      <rect x="46" y="74" width="68" height="24" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="80" y="85.5" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="700" class="mono">R3 <tspan fill="#334155" font-weight="600">[c3,c4]</tspan></text><text x="80" y="94.5" text-anchor="middle" fill="#64748b" font-size="6.8" class="mono">25% FLOPs</text>

      <!-- Corner Precision Tag -->
      <text x="308" y="25" text-anchor="end" fill="#64748b" font-size="7.4" class="mono">err 8.58e-6</text>
    </g>

    <!-- Right Specification Block -->
    <g>
      <!-- Index Badge + Repo Slug + Explore Pill -->
      <rect x="338" y="16" width="26" height="19" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.9"/>
      <text x="351" y="29" text-anchor="middle" fill="#7c3aed" font-size="9.8" font-weight="700" class="mono">03</text>
      <text x="373" y="30.5" fill="#0f172a" font-size="16" font-weight="700" class="mono">qwen-32k-longctx-train</text>

      <rect x="742" y="15" width="86" height="22" rx="11" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="785" y="29.5" text-anchor="middle" fill="#7c3aed" font-size="9.2" font-weight="700" letter-spacing="0.4" class="mono">EXPLORE ↗</text>

      <!-- 1-Line Engineering Thesis -->
      <text x="338" y="52" fill="#334155" font-size="10.8" class="sans">Single-8GB 32K steady-state training: Zero-Atomic FA2, ZigZag Ring, SAC &amp; Async DMA.</text>

      <!-- 3 KPI Micro-Chips -->
      <rect x="338" y="66" width="158" height="46" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="338" y="66" width="158" height="2.4" rx="1.2" fill="#7c3aed"/>
      <text x="349" y="86.5" fill="#7c3aed" font-size="13.2" font-weight="700" class="mono">32K (32×)</text>
      <text x="349" y="103" fill="#64748b" font-size="8.7" class="mono">Single-8GB 2-Step</text>
      <rect x="504" y="66" width="158" height="46" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="515" y="86.5" fill="#0f172a" font-size="13.2" font-weight="700" class="mono">-80.6% VRAM</text>
      <text x="515" y="103" fill="#64748b" font-size="8.7" class="mono">SAC · 15.13 TFLOPS</text>
      <rect x="670" y="66" width="158" height="46" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="681" y="86.5" fill="#0f172a" font-size="13.2" font-weight="700" class="mono">6.99× → 1.00×</text>
      <text x="681" y="103" fill="#64748b" font-size="8.7" class="mono">ZigZag Ring P=4</text>

      <!-- Bottom Stack Strip -->
      <circle cx="342" cy="133" r="3" fill="#7c3aed"/>
      <text x="352" y="136.5" fill="#64748b" font-size="9" font-weight="600" class="mono">Triton FA2 · ZigZag Ring Attn · Intra-Layer SAC · 152K Chunked CE · Pinned DMA</text>
    </g>
  </g>

  <rect x="1" y="1" width="848" height="154" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.1"/>
  <path d="M 832 8 H 842 V 18 M 832 148 H 842 V 138" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="square" stroke-opacity="0.72"/>
</svg>
